<script>
(function(){
  "use strict";
  if(typeof map==="undefined"||typeof pois==="undefined"||typeof POI==="undefined") return;
  // W trybach prezentacji / wolontariusza nie dodajemy narzędzi edytora:
  if(/^#(view=|embed=|vol=)/.test(location.hash||"")) return;

  /* ---------- 1) PŁYNNY ZOOM + CZYSTY PODGLĄD ---------- */
  map.options.zoomSnap=0;      // brak zaokrąglania -> suwak działa gładko
  map.options.zoomDelta=0.5;   // przyciski +/- skaczą po pół poziomu

  const hud=document.createElement("div");
  hud.id="previewHud";
  hud.innerHTML=`<button id="pvZoomOut" title="Pomniejsz">−</button>
    <input id="pvZoomRange" type="range" min="3" max="19" step="0.1" value="13">
    <span class="zval" id="pvZoomVal">13.0</span>
    <button id="pvZoomIn" title="Powiększ">＋</button>
    <button id="pvFit" title="Dopasuj trasę">🔍</button>`;
  document.body.appendChild(hud);

  const exitBtn=document.createElement("button");
  exitBtn.id="previewExit"; exitBtn.textContent="✕ Zamknij podgląd";
  document.body.appendChild(exitBtn);

  const range=hud.querySelector("#pvZoomRange");
  const zval=hud.querySelector("#pvZoomVal");
  function syncRange(){const z=map.getZoom();range.value=z.toFixed(2);zval.textContent=z.toFixed(1);}
  map.on("zoom zoomend",syncRange);
  range.addEventListener("input",()=>map.setZoom(parseFloat(range.value)));
  hud.querySelector("#pvZoomOut").onclick=()=>map.setZoom(map.getZoom()-0.5);
  hud.querySelector("#pvZoomIn").onclick=()=>map.setZoom(map.getZoom()+0.5);
  hud.querySelector("#pvFit").onclick=()=>{try{fitToRoute();}catch(e){}};

  function enterPreview(){document.body.classList.add("preview-mode");setTimeout(()=>{try{map.invalidateSize();}catch(e){}syncRange();},250);}
  function exitPreview(){document.body.classList.remove("preview-mode");setTimeout(()=>{try{map.invalidateSize();}catch(e){}},250);}
  exitBtn.onclick=exitPreview;
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("preview-mode"))exitPreview();});

  /* ---------- 2) WYBÓR PUNKTÓW / WOLONTARIUSZY (podgląd + PNG) ---------- */
  const modal=document.createElement("div");
  modal.id="exportSelectOverlay";
  modal.innerHTML=`<div class="plansBox" style="max-width:520px">
    <h2>Podgląd i eksport wg wyboru</h2>
    <p class="sub">Zaznacz, co ma być widoczne — na mapie (podgląd) i w pobranym pliku PNG. Możesz też ograniczyć liczbę pokazanych wolontariuszy.</p>
    <div id="expTypes" style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px"></div>
    <div class="switch" style="margin-bottom:8px"><div><span>Tylko punkty z przypisanym wolontariuszem</span><small>Ukryj punkty bez numeru i imienia</small></div><div class="toggle" id="expVolOnly"></div></div>
    <div class="distrib" style="margin-bottom:8px"><div class="inrow"><span class="unit">Ile wolontariuszy pokazać</span><input type="number" id="expVolLimit" min="0" step="1" value="0" style="width:70px"><span class="unit">(0 = wszyscy)</span></div></div>
    <div class="switch" style="margin-bottom:8px"><div><span>Pokaż linię trasy</span></div><div class="toggle on" id="expShowRoute"></div></div>
    <div class="switch" style="margin-bottom:14px"><div><span>Podpisy przy punktach (PNG)</span><small>Nazwa / imię wolontariusza pod pinezką</small></div><div class="toggle on" id="expShowLabels"></div></div>
    <div class="row" style="margin-bottom:8px"><button class="btn" id="expSelAll">Zaznacz wszystkie typy</button><button class="btn" id="expSelNone">Odznacz wszystkie</button></div>
    <div class="row" style="margin-bottom:8px"><button class="btn primary" id="expPreview">👁 Podgląd na mapie</button><button class="btn" id="expRestore">↩ Pokaż wszystko</button></div>
    <button class="btn primary" id="expDownload" style="width:100%;margin-bottom:8px">📸 Pobierz PNG z zaznaczonymi</button>
    <button class="btn plansClose" id="expClose" style="width:100%">Zamknij</button>
  </div>`;
  document.body.appendChild(modal);

  function buildTypeList(){
    const box=modal.querySelector("#expTypes");
    const present=[...new Set(pois.map(p=>p.type))];
    if(!present.length){box.innerHTML='<div class="empty">Brak punktów na mapie.</div>';return;}
    box.innerHTML="";
    present.forEach(type=>{
      const meta=POI[type]||{ic:"⭐",label:type,color:"#e67e22"};
      const count=pois.filter(p=>p.type===type).length;
      const lab=document.createElement("label");
      lab.style.cssText="display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:13px";
      lab.innerHTML=`<input type="checkbox" class="exp-type" value="${type}" checked style="width:18px;height:18px;accent-color:var(--accent);flex:none"><span style="font-size:16px">${meta.ic}</span><span style="flex:1">${meta.label}</span><span style="color:var(--ink-dim);font-size:12px">${count}</span>`;
      box.appendChild(lab);
    });
  }
  const isVol=p=>(p.volNum||"").trim()&&(p.volName||"").trim();
  function getSel(){
    const types=new Set();
    modal.querySelectorAll(".exp-type:checked").forEach(cb=>types.add(cb.value));
    const lim=parseInt(modal.querySelector("#expVolLimit").value,10);
    return{
      types,
      volOnly:modal.querySelector("#expVolOnly").classList.contains("on"),
      volLimit:(isFinite(lim)&&lim>0)?lim:null,
      showRoute:modal.querySelector("#expShowRoute").classList.contains("on"),
      showLabels:modal.querySelector("#expShowLabels").classList.contains("on")
    };
  }
  function selectedPois(sel){
    let list=pois.filter(p=>sel.types.has(p.type));
    if(sel.volOnly)list=list.filter(isVol);
    if(sel.volLimit!=null){
      const vols=list.filter(isVol).sort((a,b)=>(parseFloat(a.volNum)||0)-(parseFloat(b.volNum)||0));
      const ok=new Set(vols.slice(0,sel.volLimit).map(p=>p.id));
      list=list.filter(p=>!isVol(p)||ok.has(p.id));
    }
    return list;
  }
  function applyPreviewToMap(sel){
    const show=new Set(selectedPois(sel).map(p=>p.id));
    pois.forEach(p=>{if(!p.marker)return;
      if(show.has(p.id)){if(!map.hasLayer(p.marker))map.addLayer(p.marker);}
      else{if(map.hasLayer(p.marker))map.removeLayer(p.marker);}});
    if(!sel.showRoute){tracks.forEach(t=>{if(t.line&&map.hasLayer(t.line))map.removeLayer(t.line);});}
    else{try{redrawAllTrackLines();}catch(e){}}
  }
  function restorePreview(){try{redrawAllTrackLines();}catch(e){}try{applyPoiVisibility();}catch(e){}}

  // rysowanie pinezki na canvasie PNG
  function drawPoiPin(ctx,x,y,color,emoji,badge){
    const r=20,cy=y-r*1.5;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-r*0.6,cy);ctx.lineTo(x+r*0.6,cy);ctx.closePath();ctx.fillStyle=color;ctx.fill();
    ctx.beginPath();ctx.arc(x,cy,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#fff";ctx.stroke();
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font="19px 'Space Grotesk', system-ui, sans-serif";ctx.fillStyle="#fff";ctx.fillText(emoji,x,cy);
    if(badge!=null&&badge!==""){
      const bx=x+r*0.85,by=cy-r*0.85;
      ctx.beginPath();ctx.arc(bx,by,12,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=color;ctx.stroke();
      ctx.fillStyle=color;ctx.font="bold 13px 'Space Grotesk', system-ui, sans-serif";ctx.fillText(String(badge),bx,by+0.5);
    }
  }
  // statyczna mapa dopasowana do PODANYCH punktów (obejmuje też POI, nie tylko trasę)
  async function renderStaticMapPts(W,H,pts){
    const TILE=256;if(pts.length<1)return null;
    let minLat=Infinity,maxLat=-Infinity,minLng=Infinity,maxLng=-Infinity;
    pts.forEach(([la,ln])=>{if(la<minLat)minLat=la;if(la>maxLat)maxLat=la;if(ln<minLng)minLng=ln;if(ln>maxLng)maxLng=ln;});
    if(minLat===maxLat){minLat-=0.002;maxLat+=0.002;}
    if(minLng===maxLng){minLng-=0.003;maxLng+=0.003;}
    const PAD=110,uW=W-PAD*2,uH=H-PAD*2;let zoom=19;
    for(;zoom>=3;zoom--){const nw=pngLngLatToPixel(minLng,maxLat,zoom),se=pngLngLatToPixel(maxLng,minLat,zoom);if((se.x-nw.x)<=uW&&(se.y-nw.y)<=uH)break;}
    const nw=pngLngLatToPixel(minLng,maxLat,zoom),se=pngLngLatToPixel(maxLng,minLat,zoom);
    const cx=(nw.x+se.x)/2,cy=(nw.y+se.y)/2,originX=cx-W/2,originY=cy-H/2;
    const canvas=document.createElement("canvas");canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext("2d");ctx.imageSmoothingQuality="high";ctx.fillStyle="#e8ecef";ctx.fillRect(0,0,W,H);
    const nT=Math.pow(2,zoom),txMin=Math.floor(originX/TILE),txMax=Math.floor((originX+W)/TILE),tyMin=Math.max(0,Math.floor(originY/TILE)),tyMax=Math.min(nT-1,Math.floor((originY+H)/TILE));
    const jobs=[];
    for(let tx=txMin;tx<=txMax;tx++)for(let ty=tyMin;ty<=tyMax;ty++){
      const wx=((tx%nT)+nT)%nT;
      jobs.push(pngLoadImg(`https://tile.openstreetmap.org/${zoom}/${wx}/${ty}.png`).then(img=>{if(!img)return;ctx.drawImage(img,tx*TILE-originX,ty*TILE-originY,TILE,TILE);}));
    }
    await Promise.all(jobs);
    const toXY=(la,ln)=>{const p=pngLngLatToPixel(ln,la,zoom);return{x:p.x-originX,y:p.y-originY};};
    return{canvas,toXY,zoom};
  }

  async function exportSelectedPNG(sel){
    const btn=modal.querySelector("#expDownload"),old=btn.textContent;
    btn.disabled=true;btn.textContent="⏳ Generuję…";
    try{
      const list=selectedPois(sel),pts=[];
      if(sel.showRoute)tracks.forEach(t=>{if(t.geometry&&t.geometry.length>=2)t.geometry.forEach(g=>pts.push([g[0],g[1]]));});
      list.forEach(p=>pts.push([p.latlng.lat,p.latlng.lng]));
      if(pts.length<1){toast("Nic do pokazania — zaznacz punkty lub trasę.");return;}
      const MAP_W=1800,MAP_H=1150;
      const rendered=await renderStaticMapPts(MAP_W,MAP_H,pts);
      if(!rendered){toast("Nie udało się wyrenderować mapy.");return;}
      const{canvas:mapCanvas,toXY}=rendered,mctx=mapCanvas.getContext("2d");
      if(sel.showRoute){
        tracks.forEach(t=>{if(!t.geometry||t.geometry.length<2)return;mctx.save();mctx.strokeStyle="rgba(255,255,255,.92)";mctx.lineWidth=13;mctx.lineJoin="round";mctx.lineCap="round";mctx.beginPath();t.geometry.forEach((ll,i)=>{const q=toXY(ll[0],ll[1]);i===0?mctx.moveTo(q.x,q.y):mctx.lineTo(q.x,q.y);});mctx.stroke();mctx.restore();});
        tracks.forEach(t=>{if(!t.geometry||t.geometry.length<2)return;mctx.strokeStyle=t.color;mctx.lineWidth=7;mctx.lineJoin="round";mctx.lineCap="round";mctx.beginPath();t.geometry.forEach((ll,i)=>{const q=toXY(ll[0],ll[1]);i===0?mctx.moveTo(q.x,q.y):mctx.lineTo(q.x,q.y);});mctx.stroke();});
      }
      const cpSorted=pois.filter(p=>p.type==="checkpoint").map(p=>({p,km:kmAlong(p.latlng)??1e9})).sort((a,b)=>a.km-b.km);
      const cpNo=new Map();cpSorted.forEach((x,i)=>cpNo.set(x.p.id,i+1));
      list.forEach(p=>{
        const q=toXY(p.latlng.lat,p.latlng.lng),meta=POI[p.type]||{ic:"⭐",color:"#e67e22"};
        let badge=null;
        if(isVol(p))badge=String(p.volNum).trim();
        else if(p.type==="checkpoint"&&cpNo.has(p.id))badge=cpNo.get(p.id);
        drawPoiPin(mctx,q.x,q.y,meta.color,meta.ic,badge);
      });
      if(sel.showLabels)list.forEach(p=>{
        const q=toXY(p.latlng.lat,p.latlng.lng),meta=POI[p.type]||{label:"Punkt"};
        const label=(p.name||(isVol(p)?p.volName:meta.label)||"").slice(0,28);
        if(!label)return;
        mctx.font="bold 15px 'Space Grotesk', system-ui, sans-serif";
        const w=mctx.measureText(label).width+16,lx=q.x-w/2,ly=q.y+6,h=26;
        mctx.fillStyle="rgba(10,14,19,.86)";pngRoundRect(mctx,lx,ly,w,h,7);mctx.fill();
        mctx.fillStyle="#fff";mctx.textAlign="center";mctx.textBaseline="middle";mctx.fillText(label,q.x,ly+h/2);
      });
      // kompozycja: nagłówek + mapa + lista + stopka
      const W=MAP_W,headerH=140,mapH=MAP_H,sidePad=36,colCount=2,gap=16,rowH=34;
      const rows=Math.ceil((list.length||1)/colCount);
      const listBoxH=list.length?(54+rows*rowH+20):0,footerH=50;
      const totalH=headerH+mapH+listBoxH+footerH;
      const fc=document.createElement("canvas");fc.width=W;fc.height=totalH;
      const fx=fc.getContext("2d");fx.imageSmoothingEnabled=true;fx.imageSmoothingQuality="high";
      fx.fillStyle="#fff";fx.fillRect(0,0,W,totalH);
      const grad=fx.createLinearGradient(0,0,W,0);grad.addColorStop(0,"#ff6b1a");grad.addColorStop(1,"#ff8a3d");
      fx.fillStyle=grad;fx.fillRect(0,0,W,headerH);
      const projName=($("projName").value||"Trasa").trim();
      fx.fillStyle="#fff";fx.textAlign="left";fx.textBaseline="alphabetic";
      fx.font="bold 44px 'Space Grotesk', system-ui, sans-serif";fx.fillText(projName,sidePad,60);
      const volCount=list.filter(isVol).length,parts=[list.length+" punktów"];
      if(volCount)parts.push(volCount+" wolontariuszy");
      fx.font="22px 'Space Grotesk', system-ui, sans-serif";fx.fillStyle="rgba(255,255,255,.95)";fx.fillText(parts.join(" · "),sidePad,98);
      const dt=new Date().toLocaleDateString("pl-PL",{year:"numeric",month:"long",day:"numeric"});
      fx.textAlign="right";fx.fillStyle="#fff";fx.font="bold 22px 'Space Grotesk', system-ui, sans-serif";fx.fillText("Planer Trasy",W-sidePad,60);
      fx.font="18px 'Space Grotesk', system-ui, sans-serif";fx.fillStyle="rgba(255,255,255,.9)";fx.fillText(dt,W-sidePad,96);
      fx.drawImage(mapCanvas,0,headerH);
      fx.strokeStyle="rgba(0,0,0,.14)";fx.lineWidth=1;fx.strokeRect(0,headerH,W,mapH);
      if(list.length){
        const y0=headerH+mapH;
        fx.fillStyle="#f6f7f9";fx.fillRect(0,y0,W,listBoxH);
        fx.fillStyle="#0a0e13";fx.textAlign="left";fx.textBaseline="alphabetic";
        fx.font="bold 20px 'Space Grotesk', system-ui, sans-serif";fx.fillText("Zaznaczone punkty ("+list.length+")",sidePad,y0+34);
        const colW=Math.floor((W-sidePad*2-gap*(colCount-1))/colCount);
        const ordered=list.slice().sort((a,b)=>((kmAlong(a.latlng))??1e9)-((kmAlong(b.latlng))??1e9));
        fx.font="15px 'Space Grotesk', system-ui, sans-serif";
        ordered.forEach((p,i)=>{
          const col=i%colCount,row=Math.floor(i/colCount),x=sidePad+col*(colW+gap),y=y0+54+(row+1)*rowH-8;
          const meta=POI[p.type]||{ic:"⭐",color:"#e67e22",label:"Punkt"};
          fx.fillStyle=meta.color;fx.beginPath();fx.arc(x+6,y-5,6,0,Math.PI*2);fx.fill();
          const km=kmAlong(p.latlng),kmTxt=(km!=null)?(" · "+km.toFixed(2).replace(".",",")+" km"):"";
          const vol=isVol(p)?("  [nr "+String(p.volNum).trim()+" · "+String(p.volName).trim()+"]"):"";
          let txt=meta.ic+" "+(p.name||meta.label)+vol+kmTxt;
          const maxW=colW-24;
          if(fx.measureText(txt).width>maxW){while(txt.length>4&&fx.measureText(txt+"…").width>maxW)txt=txt.slice(0,-1);txt+="…";}
          fx.fillStyle="#334155";fx.fillText(txt,x+18,y);
        });
      }
      const fy=totalH-footerH;
      fx.fillStyle="#0a0e13";fx.fillRect(0,fy,W,footerH);
      fx.fillStyle="#8fa0b0";fx.textAlign="center";fx.textBaseline="middle";
      fx.font="14px 'Space Grotesk', system-ui, sans-serif";
      fx.fillText("© OpenStreetMap contributors · wygenerowano w Planerze Trasy",W/2,fy+footerH/2);
      fc.toBlob(blob=>{
        if(!blob){toast("Nie udało się wygenerować PNG.");return;}
        const a=document.createElement("a");
        a.href=URL.createObjectURL(blob);a.download=(projName||"trasa").replace(/[^\w\-]+/g,"_")+"_punkty.png";a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),2000);
        toast("Pobrano PNG z zaznaczonymi ✓");
      },"image/png");
    }catch(err){console.error(err);toast("Błąd: "+(err&&err.message||err));}
    finally{btn.disabled=false;btn.textContent=old;}
  }

  // wiring okna
  ["expVolOnly","expShowRoute","expShowLabels"].forEach(id=>modal.querySelector("#"+id).addEventListener("click",function(){this.classList.toggle("on");}));
  modal.querySelector("#expSelAll").onclick=()=>modal.querySelectorAll(".exp-type").forEach(cb=>cb.checked=true);
  modal.querySelector("#expSelNone").onclick=()=>modal.querySelectorAll(".exp-type").forEach(cb=>cb.checked=false);
  modal.querySelector("#expPreview").onclick=()=>{applyPreviewToMap(getSel());toast("Podgląd zastosowany na mapie.");};
  modal.querySelector("#expRestore").onclick=()=>{restorePreview();toast("Przywrócono wszystkie punkty.");};
  modal.querySelector("#expDownload").onclick=()=>exportSelectedPNG(getSel());
  modal.querySelector("#expClose").onclick=()=>modal.classList.remove("show");
  modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("show");});

  /* ---------- przyciski w panelu ---------- */
  const grp=document.createElement("div");
  grp.className="group";
  grp.innerHTML=`<div class="lbl">Podgląd mapy i wybór punktów</div>
    <button class="btn primary" id="cleanPreviewBtn" style="margin-bottom:8px">🗺 Czysty podgląd mapy (suwak zoom)</button>
    <button class="btn primary" id="openExportSelectBtn">🎯 Wybierz co pokazać / pobierz PNG</button>
    <p class="hint">„Czysty podgląd" chowa panel i wyszukiwarkę — zostaje sama mapa z suwakiem do płynnego powiększania. „Wybierz co pokazać" pozwala zaznaczyć typy punktów i ograniczyć liczbę wolontariuszy — w podglądzie na mapie i w pobranym PNG (tym razem z pinezkami i podpisami).</p>`;
  document.querySelector(".scroll").prepend(grp);
  grp.querySelector("#cleanPreviewBtn").onclick=enterPreview;
  grp.querySelector("#openExportSelectBtn").onclick=()=>{buildTypeList();modal.classList.add("show");};

  syncRange();
})();
</script>
